[project]
name = "bubble-fl-demand-forecasting"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flwr>=1.43.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.5",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs>=1.18.1.1",
]

[tool.ruff]
line-length = 120
include = ["src/**/*.py"]
respect-gitignore = false

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001"]

[tool.mypy]
files = ["src"]
